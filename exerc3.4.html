<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 3.4 - Painel Dinâmico de Cadastros</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 500px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        ul {
            list-style-type: none;
            padding: 0;
            margin-top: 20px;
        }
        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #f8f9fa;
            border: 1px solid #ddd;
            margin-bottom: 8px;
            border-radius: 4px;
        }
        .btn-excluir {
            background-color: #dc3545;
            padding: 5px 10px;
        }
        .btn-excluir:hover {
            background-color: #bd2130;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Cadastro de Produtos</h2>
    
    <!-- 1. Estrutura do Formulário -->
    <div class="form-group">
        <label for="nomeProduto">Nome do Produto:</label>
        <input type="text" id="nomeProduto" placeholder="Ex: Notebook">
    </div>
    
    <div class="form-group">
        <label for="precoProduto">Preço (R$):</label>
        <input type="number" id="precoProduto" step="0.01" placeholder="Ex: 3500.00">
    </div>
    
    <button id="btnCadastrar">Cadastrar Produto</button>

    <!-- Lista onde os produtos serão inseridos -->
    <ul id="listaProdutos"></ul>
</div>

<script>
    // Seleção dos elementos do DOM
    const inputNome = document.getElementById('nomeProduto');
    const inputPreco = document.getElementById('precoProduto');
    const btnCadastrar = document.getElementById('btnCadastrar');
    const listaProdutos = document.getElementById('listaProdutos');

    // 2. Função de cadastro executada ao clicar no botão
    btnCadastrar.addEventListener('click', function() {
        const nome = inputNome.value.trim();
        const preco = parseFloat(inputPreco.value);

        // Validação simples para evitar campos vazios ou valores inválidos
        if (!nome || isNaN(preco)) {
            alert('Por favor, preencha todos os campos corretamente.');
            return;
        }

        // a. Criação do elemento <li>
        const novoItem = document.createElement('li');

        // b. Formatação do preço e definição do texto do <li>
        const precoFormatado = preco.toFixed(2);
        novoItem.textContent = `${nome} - R$ ${precoFormatado} `;

        // c. Criação dinâmica do botão "Excluir"
        const btnExcluir = document.createElement('button');
        btnExcluir.textContent = 'Excluir';
        btnExcluir.className = 'btn-excluir';

        // d. Adição do evento onclick para remover o elemento pai diretamente
        btnExcluir.onclick = function() {
            novoItem.remove();
        };

        // e. Anexando o botão dentro do <li> e o <li> dentro da <ul>
        novoItem.appendChild(btnExcluir);
        listaProdutos.appendChild(novoItem);

        // Limpeza dos campos após o cadastro bem-sucedido
        inputNome.value = '';
        inputPreco.value = '';
        inputNome.focus();
    });
</script>

</body>
</html>
